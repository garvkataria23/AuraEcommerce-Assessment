<div class="details-card">
  <div class="p-3 px-4 d-flex justify-content-between align-items-center" style="border-bottom: 1px solid var(--border);">
    <h4 class="mb-0 fw-bold"><i class="bi bi-heart-fill" style="color: #ff6584;"></i> My Wishlist <span style="font-size: 0.85rem; color: var(--text-light);" *ngIf="items.length">({{ items.length }})</span></h4>
    <a class="ac-btn" routerLink="/products"><i class="bi bi-grid-fill"></i> Shop</a>
  </div>
  <div class="p-4">
    <!-- Skeleton -->
    <div *ngIf="loading">
      <div class="row g-3">
        <div class="col-6 col-md-3" *ngFor="let _ of skeletonArray">
          <div class="skeleton-card p-3">
            <div class="skeleton" style="aspect-ratio: 1; width: 100%; border-radius: var(--radius-md);"></div>
            <div class="skeleton skeleton-text mt-2" style="width: 70%;"></div>
            <div class="skeleton skeleton-text mt-1" style="width: 40%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && items.length === 0" class="empty-state">
      <div class="empty-state-icon" style="font-size: 3rem;"><i class="bi bi-heart"></i></div>
      <h4>Your wishlist is empty</h4>
      <p>Save your favourite items here and shop them later!</p>
      <a class="btn-custom btn-primary-custom ripple" routerLink="/products"><i class="bi bi-grid-fill"></i> Browse Products</a>
    </div>

    <!-- Wishlist Items -->
    <div class="row g-3" *ngIf="!loading && items.length > 0">
      <div class="col-6 col-md-4 col-lg-3" *ngFor="let p of items">
        <div class="product-card-sm">
          <div class="pcs-img-wrap" style="position: relative;">
            <a [routerLink]="['/product', p._id || p.id]">
              <img [src]="p.image" [alt]="p.name" loading="lazy">
            </a>
            <button class="wl-remove" (click)="remove(p)" title="Remove from wishlist">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <div class="pcs-body">
            <a [routerLink]="['/product', p._id || p.id]" class="text-decoration-none">
              <span class="pcs-name">{{ p.name }}</span>
            </a>
            <span class="pcs-price">{{ p.price | currency:'INR' }}</span>
            <button class="ac-btn w-100 mt-1" style="font-size: 0.8rem; padding: 0.3rem 0.5rem;" (click)="addToCart(p)">
              <i class="bi bi-cart-plus"></i> Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
