<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="checkout-card">
      <div class="p-4 text-center" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">
          <i class="bi bi-person-circle"></i>
        </div>
        <h4 class="fw-bold mb-1">Welcome Back</h4>
        <small style="opacity: 0.8;">Sign in to your account</small>
      </div>

      <div class="checkout-body">
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="mb-3">
            <label class="form-label-custom">Email Address</label>
            <input class="form-control-custom" formControlName="email"
              type="email" placeholder="you@example.com"
              [class.is-invalid]="submitted && f.email.errors">
            <div class="invalid-feedback" *ngIf="submitted && f.email.errors?.required">
              Email is required
            </div>
            <div class="invalid-feedback" *ngIf="submitted && f.email.errors?.email">
              Enter a valid email address
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-custom">Password</label>
            <div style="position: relative;">
              <input class="form-control-custom" formControlName="password"
                [type]="showPassword ? 'text' : 'password'" placeholder="Enter password"
                [class.is-invalid]="submitted && f.password.errors">
              <button type="button" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-light); cursor: pointer;"
                (click)="showPassword = !showPassword">
                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
            <div class="invalid-feedback" *ngIf="submitted && f.password.errors?.required">
              Password is required
            </div>
            <div class="invalid-feedback" *ngIf="submitted && f.password.errors?.minlength">
              Password must be at least 6 characters
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <label class="d-flex align-items-center gap-2" style="cursor: pointer; font-size: 0.9rem; color: var(--text-secondary);">
              <input type="checkbox" formControlName="remember" style="accent-color: var(--primary);">
              Remember me
            </label>
            <a href="#" style="color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 500;">
              Forgot password?
            </a>
          </div>

          <button class="btn-custom btn-primary-custom w-100 text-center" style="padding: 0.9rem;">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-4" style="font-size: 0.9rem; color: var(--text-secondary);">
          Don't have an account? <a routerLink="/products" style="color: var(--primary); text-decoration: none; font-weight: 600;">Browse Products</a>
        </div>
      </div>
    </div>
  </div>
</div>
