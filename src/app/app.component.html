<nav class="navbar navbar-expand-lg navbar-modern sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/products">
      <i class="bi bi-shop"></i> AuraStore
    </a>

    <div class="d-flex align-items-center gap-2 order-lg-last">
      <button class="theme-toggle" (click)="toggleTheme()" title="Toggle theme">
        <i class="bi" [ngClass]="isDark ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
      </button>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <i class="bi bi-list fs-4" style="color: var(--text-primary);"></i>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a class="nav-link nav-link-modern" routerLink="/products" routerLinkActive="active">
            <i class="bi bi-grid-fill"></i> Products
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-modern" routerLink="/cart" routerLinkActive="active">
            <i class="bi bi-cart-fill"></i> Cart
            <span class="cart-badge ms-1" *ngIf="cartService.getCartCount() > 0">
              {{ cartService.getCartCount() }}
            </span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-modern" routerLink="/checkout" routerLinkActive="active">
            <i class="bi bi-credit-card-fill"></i> Checkout
          </a>
        </li>
        <li class="nav-item" *ngIf="!auth.isLoggedIn">
          <a class="nav-link nav-link-modern" routerLink="/login" routerLinkActive="active">
            <i class="bi bi-person-fill"></i> Sign In
          </a>
        </li>
        <li class="nav-item" *ngIf="auth.isLoggedIn">
          <a class="nav-link nav-link-modern" routerLink="/orders" routerLinkActive="active">
            <i class="bi bi-box-seam"></i> Orders
          </a>
        </li>
        <li class="nav-item" *ngIf="auth.isAdmin">
          <a class="nav-link nav-link-modern" routerLink="/admin" routerLinkActive="active">
            <i class="bi bi-shield-lock"></i> Admin
          </a>
        </li>
        <li class="nav-item" *ngIf="auth.isLoggedIn">
          <a class="nav-link nav-link-modern" style="cursor: pointer;" (click)="logout()">
            <i class="bi bi-person-circle"></i> {{ displayName }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4 position-relative">
  <div [@routeAnimation]="getRouteAnimation()">
    <router-outlet></router-outlet>
  </div>
</main>

<app-toast></app-toast>

<app-chat></app-chat>

<button class="back-to-top" [class.visible]="showBackToTop" (click)="scrollToTop()" title="Back to top">
  <i class="bi bi-arrow-up"></i>
</button>

<footer class="footer-modern">
  <div class="container text-center">
    <div class="footer-brand mb-2">AuraStore</div>
    <div class="footer-links mb-2">
      <a routerLink="/products">Products</a>
      <a routerLink="/cart">Cart</a>
      <a routerLink="/checkout">Checkout</a>
      <a routerLink="/orders">Orders</a>
      <a routerLink="/login">Account</a>
    </div>
    <small>&copy; 2026 AuraStore. All rights reserved.</small>
  </div>
</footer>
